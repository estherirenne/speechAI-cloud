server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # DNS internal Docker: nginx tetap bisa start walau layanan api belum ada
  resolver 127.0.0.11 valid=10s ipv6=off;

  location / {
    try_files $uri /index.html;
  }

  # /api/* dan /health diteruskan ke container "api" lewat network Docker
  location ~ ^/(api/|health$) {
    set $upstream http://api:3000;
    proxy_pass $upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 130s;
  }
}
